<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasifikasi Penyakit Tanaman Strawberry</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1a472a 100%);
            min-height: 100vh;
            color: #e8f5e9;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #81c784;
            background: rgba(129,199,132,0.1);
        }
        .upload-zone input { display: none; }
        .btn {
            background: #388e3c;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .btn:hover { background: #2e7d32; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin: 1rem 0;
            display: none;
        }
        .preview.visible { display: block; }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            display: none;
        }
        .result.visible { display: block; }
        .result h3 { margin-bottom: 0.5rem; color: #a5d6a7; }
        .confidence-bar {
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #66bb6a, #81c784);
            transition: width 0.3s;
        }
        .error { color: #ef9a9a; margin-top: 0.5rem; }
        .loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍓 Klasifikasi Penyakit Tanaman Strawberry</h1>
        <h3>Dibuat oleh : PUTRI REGINA TAMBUNAN</h3>
        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept="image/*">
                <p>Seret gambar ke sini atau klik untuk memilih</p>
                <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 0.5rem;">PNG, JPG, JPEG, GIF, WEBP (max 16MB)</p>
            </div>
            <img id="preview" class="preview" alt="Preview">
            <div style="text-align: center;">
                <button class="btn" id="predictBtn" disabled>Prediksi</button>
            </div>
            <div id="result" class="result"></div>
            <div id="error" class="error"></div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const predictBtn = document.getElementById('predictBtn');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        let selectedFile = null;

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Pilih file gambar');
                return;
            }
            errorDiv.textContent = '';
            resultDiv.classList.remove('visible');
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.add('visible');
                predictBtn.disabled = false;
                selectedFile = file;
            };
            reader.readAsDataURL(file);
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            resultDiv.classList.remove('visible');
        }

        predictBtn.addEventListener('click', async () => {
            const file = selectedFile || (fileInput.files.length ? fileInput.files[0] : null);
            if (!file) return;
            predictBtn.disabled = true;
            resultDiv.classList.remove('visible');
            errorDiv.textContent = '';
            resultDiv.parentElement.classList.add('loading');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/predict', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Prediksi gagal');

                resultDiv.innerHTML = `
                    <h3>Hasil: ${data.class}</h3>
                    <p>Confidence: ${data.confidence}%</p>
                    <div class="confidence-bar"><div class="confidence-fill" style="width:${data.confidence}%"></div></div>
                    ${data.all_probs ? '<details><summary>Semua kelas</summary><pre style="margin-top:0.5rem;font-size:0.85rem;">' + JSON.stringify(data.all_probs, null, 2) + '</pre></details>' : ''}
                `;
                resultDiv.classList.add('visible');
            } catch (err) {
                showError(err.message);
            } finally {
                predictBtn.disabled = false;
                resultDiv.parentElement.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
